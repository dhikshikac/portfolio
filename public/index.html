<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta
      name="description"
      content="Dhikshika Cherivirala — portfolio showcasing design and development work."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Instrument+Serif:ital@1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/images/about/community-star.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/about/community-star.png" />
    <title>Dhikshika Cherivirala</title>
    <script>
      // Apply day/night before first paint: the visitor's saved choice if
      // they've toggled, otherwise their system's light/dark setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var day = saved
          ? saved === 'day'
          : window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
        if (day) {
          document.documentElement.setAttribute('data-theme', 'day');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#cfe1f3');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
